<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="icon-clip">
      <rect width="1024" height="1024" rx="180" ry="180"/>
    </clipPath>
    <symbol id="star" viewBox="-12 -12 24 24">
      <polygon points="0,-12 2.94,-4.05 11.41,-3.71 4.76,1.55 7.05,9.71 0,5 -7.05,9.71 -4.76,1.55 -11.41,-3.71 -2.94,-4.05" fill="white"/>
    </symbol>
  </defs>

  <g clip-path="url(#icon-clip)">

    <!-- ── AMERICAN FLAG ── -->
    <!-- Red base (stripes 1,3,5,7,9,11,13) -->
    <rect fill="#B22234" width="1024" height="1024"/>
    <!-- White stripes (2,4,6,8,10,12) — each 78.77 px -->
    <rect fill="#FFFFFF" y="78.77"  width="1024" height="78.77"/>
    <rect fill="#FFFFFF" y="236.31" width="1024" height="78.77"/>
    <rect fill="#FFFFFF" y="393.85" width="1024" height="78.77"/>
    <rect fill="#FFFFFF" y="551.38" width="1024" height="78.77"/>
    <rect fill="#FFFFFF" y="708.92" width="1024" height="78.77"/>
    <rect fill="#FFFFFF" y="866.46" width="1024" height="78.77"/>

    <!-- ── BLUE CANTON (top-left, 40 % wide × top-7-stripes tall) ── -->
    <rect fill="#3C3B6E" x="0" y="0" width="410" height="551"/>

    <!-- ── 50 CANTON STARS ── -->
    <!-- 6-star rows at y ≈ 28, 138, 248, 358, 468 -->
    <!-- 5-star rows at y ≈ 83, 193, 303, 413 -->
    <!-- Row 1 – 6 stars -->
    <use href="#star" x="24"  y="18"  width="20" height="20"/>
    <use href="#star" x="92"  y="18"  width="20" height="20"/>
    <use href="#star" x="160" y="18"  width="20" height="20"/>
    <use href="#star" x="228" y="18"  width="20" height="20"/>
    <use href="#star" x="296" y="18"  width="20" height="20"/>
    <use href="#star" x="364" y="18"  width="20" height="20"/>
    <!-- Row 2 – 5 stars -->
    <use href="#star" x="58"  y="73"  width="20" height="20"/>
    <use href="#star" x="126" y="73"  width="20" height="20"/>
    <use href="#star" x="194" y="73"  width="20" height="20"/>
    <use href="#star" x="262" y="73"  width="20" height="20"/>
    <use href="#star" x="330" y="73"  width="20" height="20"/>
    <!-- Row 3 – 6 stars -->
    <use href="#star" x="24"  y="128" width="20" height="20"/>
    <use href="#star" x="92"  y="128" width="20" height="20"/>
    <use href="#star" x="160" y="128" width="20" height="20"/>
    <use href="#star" x="228" y="128" width="20" height="20"/>
    <use href="#star" x="296" y="128" width="20" height="20"/>
    <use href="#star" x="364" y="128" width="20" height="20"/>
    <!-- Row 4 – 5 stars -->
    <use href="#star" x="58"  y="183" width="20" height="20"/>
    <use href="#star" x="126" y="183" width="20" height="20"/>
    <use href="#star" x="194" y="183" width="20" height="20"/>
    <use href="#star" x="262" y="183" width="20" height="20"/>
    <use href="#star" x="330" y="183" width="20" height="20"/>
    <!-- Row 5 – 6 stars -->
    <use href="#star" x="24"  y="238" width="20" height="20"/>
    <use href="#star" x="92"  y="238" width="20" height="20"/>
    <use href="#star" x="160" y="238" width="20" height="20"/>
    <use href="#star" x="228" y="238" width="20" height="20"/>
    <use href="#star" x="296" y="238" width="20" height="20"/>
    <use href="#star" x="364" y="238" width="20" height="20"/>
    <!-- Row 6 – 5 stars -->
    <use href="#star" x="58"  y="293" width="20" height="20"/>
    <use href="#star" x="126" y="293" width="20" height="20"/>
    <use href="#star" x="194" y="293" width="20" height="20"/>
    <use href="#star" x="262" y="293" width="20" height="20"/>
    <use href="#star" x="330" y="293" width="20" height="20"/>
    <!-- Row 7 – 6 stars -->
    <use href="#star" x="24"  y="348" width="20" height="20"/>
    <use href="#star" x="92"  y="348" width="20" height="20"/>
    <use href="#star" x="160" y="348" width="20" height="20"/>
    <use href="#star" x="228" y="348" width="20" height="20"/>
    <use href="#star" x="296" y="348" width="20" height="20"/>
    <use href="#star" x="364" y="348" width="20" height="20"/>
    <!-- Row 8 – 5 stars -->
    <use href="#star" x="58"  y="403" width="20" height="20"/>
    <use href="#star" x="126" y="403" width="20" height="20"/>
    <use href="#star" x="194" y="403" width="20" height="20"/>
    <use href="#star" x="262" y="403" width="20" height="20"/>
    <use href="#star" x="330" y="403" width="20" height="20"/>
    <!-- Row 9 – 6 stars -->
    <use href="#star" x="24"  y="458" width="20" height="20"/>
    <use href="#star" x="92"  y="458" width="20" height="20"/>
    <use href="#star" x="160" y="458" width="20" height="20"/>
    <use href="#star" x="228" y="458" width="20" height="20"/>
    <use href="#star" x="296" y="458" width="20" height="20"/>
    <use href="#star" x="364" y="458" width="20" height="20"/>

    <!-- ── STATUE OF LIBERTY SILHOUETTE ── -->
    <!-- Color: #4A7B6E (statue patina / sage-teal), opacity 0.92 -->

    <!-- Pedestal ledge -->
    <rect fill="#4A7B6E" opacity="0.92" x="448" y="822" width="328" height="20"/>
    <!-- Pedestal base -->
    <rect fill="#4A7B6E" opacity="0.92" x="468" y="842" width="288" height="88" rx="6"/>

    <!-- Main gown / body (trapezoid) -->
    <polygon fill="#4A7B6E" opacity="0.92"
      points="532,502 692,502 766,822 458,822"/>

    <!-- Shoulders / upper torso (wider trapezoid) -->
    <polygon fill="#4A7B6E" opacity="0.92"
      points="504,428 734,428 712,510 516,510"/>

    <!-- Left arm holding tablet -->
    <polygon fill="#4A7B6E" opacity="0.92"
      points="504,415 468,342 432,355 460,432"/>
    <!-- Tablet -->
    <rect fill="#4A7B6E" opacity="0.92" x="416" y="326" width="68" height="96" rx="8"/>

    <!-- Neck -->
    <rect fill="#4A7B6E" opacity="0.92" x="587" y="375" width="56" height="60"/>

    <!-- Head -->
    <circle fill="#4A7B6E" opacity="0.92" cx="615" cy="332" r="70"/>

    <!-- Crown — 7 radiating rays (outer r=92, inner r=45, center (615,278)) -->
    <polygon fill="#4A7B6E" opacity="0.92"
      points="615,186 637,243 690,226 661,272 708,308 652,311 657,368 615,330 573,368 578,311 522,308 569,272 540,226 593,243"/>

    <!-- Right arm raised toward torch -->
    <polygon fill="#4A7B6E" opacity="0.92"
      points="724,410 764,388 836,175 858,188 790,405 754,432"/>

    <!-- Torch handle -->
    <rect fill="#4A7B6E" opacity="0.92" x="836" y="135" width="28" height="52" rx="7"/>

    <!-- Torch flame — layered ellipses for glow -->
    <ellipse fill="#FF6B00" cx="850" cy="124" rx="24" ry="36"/>
    <ellipse fill="#FFA500" cx="850" cy="110" rx="16" ry="26"/>
    <ellipse fill="#FFD700" cx="850" cy="98"  rx="10" ry="18"/>
    <ellipse fill="#FFFACD" cx="850" cy="90"  rx="5"  ry="10"/>

    <!-- ── BOTTOM TEXT BAND ── -->
    <rect fill="rgba(0,0,18,0.78)" x="0" y="806" width="1024" height="218"/>

    <!-- "USA" — large bold white -->
    <text x="48" y="940"
      font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
      font-size="210"
      font-weight="900"
      fill="white">USA</text>

    <!-- "Citizenship Test" — gold subtitle -->
    <text x="52" y="1006"
      font-family="'Arial','Helvetica',sans-serif"
      font-size="68"
      font-weight="700"
      fill="#FFD700"
      letter-spacing="1">Citizenship Test</text>

  </g>
</svg>
